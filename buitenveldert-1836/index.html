<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Middelste watermolen, Buitenveldert 1836</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import { start, THREE, M, mat, box, beam, cyl, ring, rand, Eased, beaufort } from '../common/engine.js';
import { buildSmockMill, sailOmega } from '../common/mill.js';
import * as A from '../common/assets.js';

const Y_BOEZEM = 0.5, Y_POLDER = -1.4, FIELD = -1.0;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
let mill;

start({
  slug: 'buitenveldert-1836',
  meta: {
    title: 'Middelste watermolen<br>Buitenveldert, 1836',
    original: 'Teekening van de Tweede of Middelste Water-molen staande in de Binnen-dijksche-Buiten-veldersche-Polder in 1836 van een Scheprad in een Vijzel gereconstrueerd',
    rows: [['Type', 'Octagonal drainage mill, its paddle wheel rebuilt as an Archimedes screw (vijzel)'],
           ['Maker', 'J. Maurik · elevation, plan and pile plan · 87 × 57 cm'],
           ['Source', 'Noord-Hollands Archief, Provinciale Atlas Noord-Holland, coll. 122, inv. 377'],
           ['Licence', 'Public domain (PDM 1.0)']],
    link: 'https://noord-hollandsarchief.nl/beelden/beeldbank/detail/FF4CCF0AFB8E11DF9E4D523BC2E286E2',
    drawings: [{src: "https://images.memorix.nl/ranh/thumb/1920x1080/f6fc8219-b52f-2cee-f84a-dbbf18ba01ea.jpg", thumb: "https://images.memorix.nl/ranh/thumb/640x480/f6fc8219-b52f-2cee-f84a-dbbf18ba01ea.jpg", caption: "Vijzelmolen, Buitenveldert 1836. Noord-Hollands Archief, coll. 122, inv. 377"}],
  },
  panel: { title: 'Middelste watermolen', sub: 'Buitenveldert, 1836 · drag to orbit, scroll to zoom',
    note: 'In 1836 this mill’s paddle wheel was replaced by a three-flight screw, which can lift water higher. The polder it drained is now Buitenveldert and the Zuidas. Aircraft landing on the Buitenveldertbaan still pass overhead.' },
  controls: [{ key: 'wind', label: 'Wind speed', min: 0, max: 20, step: 0.1, value: 7, unit: 'm/s', hint: beaufort }],
  buttons: [{ key: 'brake', label: 'Brake (vang)', pressed: false, warn: true },
            { key: 'cut', label: 'Cutaway', pressed: true, onToggle: (on) => mill.setCutaway(on) }],
  weather: {kind: 'sun'},
  camera: { pos: [24, 6.5, 30], target: [-1.6, 3.2, 3.8], max: 400 },
  shadowSize: 32,
  fog: { color: 0xc9d2d8, near: 300, far: 2600 },
  waters: [
    { x: [-70, -6], z: [-600, 600], y: Y_BOEZEM, color: 0x15302c, size: 32 },
    { x: [6, 700], z: [-700, 700], y: Y_POLDER, color: 0x14302a },
  ],
  exclusions: [[-8, 18, -6, 6]],
  ambient: { fishCenter: [-30, 0, 0] },
  build,
});

function build(ctx) {
  const { scene } = ctx;
  // ---------------- land: mill dike between boezem and polder, parcels with ditches, city beyond
  box(scene, M.clay(), -6, 6, -3, 1.0, -600, -5); box(scene, M.clay(), -6, 6, -3, 1.0, 5, 600);
  for (const [z0, z1] of [[-5, -1.3], [1.3, 5]]) box(scene, M.clay(), -6, 6, -3, 1.0, z0, z1);
  box(scene, mat(0x8a8478, 0.9, 0, 0.3, 2), -3.6, -1.6, 1.0, 1.05, -600, -7); box(scene, mat(0x8a8478, 0.9, 0, 0.3, 2), -3.6, -1.6, 1.0, 1.05, 7, 600);
  for (let x = 14; x < 690; x += 130) for (let z = -690; z < 690; z += 30) { if (Math.abs(z) < 16 && x < 30) continue; A.field(ctx, x, Math.min(x + 125, 700), z, z + 27, FIELD, 0x5d7340, 1.2); }
  box(scene, M.clay(), -76, -70, -3, 1.4, -600, 600);
  box(scene, M.grass(), -900, -76, -3, 1.0, -900, 900);

  // ---------------- the mill (with the flag the draughtsman gave it)
  mill = buildSmockMill(ctx, { y0: 1.0, baseH: 1.4, Rb: 5.0, Rt: 2.9, H: 11.0, sailR: 12, sailW: 2.2, flag: true, vBottom: 2.2 });

  // spur wheel (spoorwiel) at the foot of the vertical shaft
  const SP_R = 1.35, SP_Y = 2.7;
  ring(mill.vs, M.elm(), V(0, SP_Y, 0), V(0, 1, 0), SP_R - 0.35, SP_R + 0.1, 0.22, 40);
  for (const a of [0, Math.PI / 2]) box(mill.vs, M.elm(), -SP_R, SP_R, SP_Y - 0.1, SP_Y + 0.1, -0.12, 0.12).rotation.y = a;
  for (let i = 0; i < 40; i++) { const a = i / 40 * Math.PI * 2;
    const c = box(mill.vs, M.cog(), -0.07, 0.07, SP_Y - 0.42, SP_Y - 0.1, -0.06, 0.06); c.position.set(Math.cos(a) * (SP_R - 0.15), 0, Math.sin(a) * (SP_R - 0.15)); c.rotation.y = -a; }

  // ---------------- the screw (vijzel): three flights, inclined 30 degrees, in a brick race
  const ANG = 30 * Math.PI / 180, LEN = 8.4, RS = 0.85, PITCH = 1.15;
  const top = V(mill.vx + SP_R + 0.55, SP_Y - 0.95, 0);
  const d = V(Math.cos(ANG), -Math.sin(ANG), 0);
  const bot = top.clone().addScaledVector(d, LEN);
  const screwPivot = new THREE.Group(); screwPivot.position.copy(top); screwPivot.rotation.z = -ANG; scene.add(screwPivot);
  const screw = new THREE.Group(); screwPivot.add(screw);                  // local X runs down the screw
  cyl(screw, M.oak(), [-0.6, 0, 0], [LEN + 0.3, 0, 0], 0.26, 12);
  for (const x of [0.4, LEN / 2, LEN - 0.2]) cyl(screw, M.iron(), [x - 0.05, 0, 0], [x + 0.05, 0, 0], 0.29, 12);
  // vijzelwiel: a bevel-like wheel on the top of the screw shaft, cogs meshing with the spur wheel
  ring(screw, M.elm(), V(-0.35, 0, 0), V(1, 0, 0), 0.45, 0.75, 0.16, 24);
  for (let i = 0; i < 30; i++) { const a = i / 30 * Math.PI * 2; const c = box(screw, M.cog(), -0.6, -0.38, -0.05, 0.05, -0.06, 0.06); c.position.set(0, Math.cos(a) * 0.62, Math.sin(a) * 0.62); c.rotation.x = a; }
  const blade = (phase) => {
    const turns = LEN / PITCH, seg = Math.ceil(turns * 40), pos = [], idx = [];
    for (let i = 0; i <= seg; i++) { const x = 0.3 + (LEN - 0.5) * i / seg, a = phase + (x / PITCH) * Math.PI * 2;
      for (const r of [0.26, RS]) pos.push(x, Math.cos(a) * r, Math.sin(a) * r); }
    for (let i = 0; i < seg; i++) { const a = 2 * i; idx.push(a, a + 1, a + 3, a, a + 3, a + 2); }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
    const m = new THREE.Mesh(g, mat(0xb08e66, 0.75, 0, 0.2, 7, { side: THREE.DoubleSide })); m.castShadow = true; screw.add(m);
  };
  for (let k = 0; k < 3; k++) blade(k * Math.PI * 2 / 3);                // "3 slingers om de balk"
  // brick race (vijzelbak): inclined floor and walls following the screw, funnel inlet at the bottom
  const brick = M.brick();
  const fl = beam(scene, brick, top.clone().add(V(-0.3, -RS - 0.25, 0)), bot.clone().add(V(0.6, -RS - 0.25, 0)), 2.3, 0.4);
  for (const s of [-1, 1]) beam(scene, brick, top.clone().add(V(-0.3, -0.75, s * (RS + 0.35))), bot.clone().add(V(0.6, -0.75, s * (RS + 0.35))), 0.4, 0.9);
  for (const s of [-1, 1]) beam(scene, brick, V(bot.x + 0.3, -1.6, s * 1.2), V(bot.x + 3.5, -1.6, s * 3.2), 0.4, 2.0);
  // outlet from the top of the screw back under the mill to the boezem
  box(scene, brick, -10, top.x, 0.2, 0.4, -1.25, 1.25);
  for (const s of [-1, 1]) box(scene, brick, -10, top.x, 0.2, 1.3, s * 1.25 - 0.15, s * 1.25 + 0.15);
  const outW = new THREE.Mesh(new THREE.BoxGeometry(top.x + 10, 0.02, 2.2), mat(0x1a3a36, 0.06, 0.2, 0, 1, { envMapIntensity: 1.5 })); outW.position.set((top.x - 10) / 2, 0.75, 0); scene.add(outW);
  const spray = ctx.smoke({ pos: V(top.x - 0.6, 1.0, 0), count: 90, rate: () => 30 * Math.min(1, screwOmega / 3), life: 1.0, size0: 0.25, size1: 1.0, color: 0xffffff, opacity: 0.55, vel: V(-1.5, 0.9, 0), gravity: 4, drift: 0, spread: 1, jitter: 0.4 });
  A.foam(ctx, -8, 0, Y_BOEZEM + 0.02, 1.8);

  // ---------------- the city that replaced the polder
  const zuidas = [];
  for (let i = 0; i < 14; i++) zuidas.push([rand(-120, 260), rand(-560, -330), rand(22, 40), rand(20, 34), rand(55, 125), [0x8fa9b8, 0x9fb2b8, 0x6f8a99, 0xb8c2c6, 0x7d8f86][i % 5]]);
  A.towers(ctx, zuidas);
  A.crane(ctx, 40, -300, 70, 50); A.crane(ctx, 180, -360, 80, 55);
  // A10 ring road on a viaduct, with the metro beside it
  box(scene, mat(0x9aa0a4, 0.8, 0, 0.1), -900, 900, 6.5, 7.6, -232, -210);
  for (let x = -880; x < 900; x += 40) box(scene, mat(0x9aa0a4, 0.8, 0, 0.1), x - 1, x + 1, FIELD, 6.5, -228, -214);
  box(scene, mat(0xbfc5c9, 0.6, 0.2, 0.05), -900, 900, 7.6, 10, -210.4, -209.8);       // noise wall
  A.traffic(ctx, [[-900, 0, -226], [900, 0, -226]], 7.6, 12, 26, { lanes: [-2.5, -6.0] });
  A.train(ctx, [[-900, 0, -215], [900, 0, -215]], 7.6, 4, 22, [15, 30]);
  // aircraft landing on the Buitenveldertbaan, low, westbound
  A.airplane(ctx, { landing: true, heading: Math.PI, offset: [-140, -40], alt0: 260, alt1: 80, speed: 72, every: [20, 40], first: [5, 9], size: 1.2 });
  // the first and third mills of the same polder, and a horse cart on the dike
  A.smallMill(ctx, -1, 160, 1.0, 1.05, 'polder', 0);
  A.smallMill(ctx, -1, -160, 1.0, 1.0, 'polder', 0);
  A.horseCart(ctx, [[-2.6, 0, 20], [-2.6, 0, 140]], 1.05, 1.3);
  A.cyclists(ctx, [[-2.6, 0, -20], [-2.6, 0, -150]], 1.05, 4, 5, { cargo: true });
  A.ship(ctx, 'tour', [[-38, 0, -500], [-38, 0, 500]], Y_BOEZEM, 3, { scale: 0.9 });
  // nature, still there
  A.cows(ctx, [40, 120, 30, 100], FIELD, 7);
  A.waterfowl(ctx, [-60, -12, -80, 80], Y_BOEZEM, 8, 'goose');
  A.waterfowl(ctx, [-60, -12, -40, 40], Y_BOEZEM, 3, 'swan');
  A.heron(ctx, 13.6, 16.5, Y_POLDER - 0.35, 3.0);
  A.storkNest(ctx, 30, 40, FIELD);
  A.beaver(ctx, [[-20, 0, -150], [-30, 0, 0], [-22, 0, 150], [-45, 0, 0]], Y_BOEZEM);
  A.reeds(ctx, [[-6.6, -300, -6.6, -8], [-6.6, 8, -6.6, 300], [6.6, -300, 6.6, -6], [6.6, 6, 6.6, 300]], -0.2);
  A.trees(ctx, [[-4.5, 30, 1, 1], [-4.5, 40, 1, 0.9], [-4.5, -30, 1, 1.05], [-4.5, -42, 1, 1]], 'pollard');
  // pollution
  A.sunkenScooter(ctx, 12, -15.5, Y_POLDER - 0.2, 0.9);
  A.plasticRaft(ctx, -30, 40, Y_BOEZEM, 2.5);
  A.oilSlick(ctx, -40, -60, Y_BOEZEM, 6);

  // ---------------- drive
  const sails = new Eased(0.8, 1.2, 2.6);
  let angle = 0, screwOmega = 0;
  const RATIO_LOW = 40 / 30;                                     // spur wheel cogs : screw wheel cogs
  // ---------------- section: the dike beside the screw race cut away, so the lower half of the screw shows
  const fnd = new THREE.Mesh(new THREE.CylinderGeometry(4.6, 4.9, 3.0, 8), M.brick()); fnd.position.set(0, -1.9, 0); fnd.rotation.y = Math.PI / 8; fnd.castShadow = true; scene.add(fnd);
  ctx.section({ x: [-6, 14], z: [1.0, 10], bottom: -3.4, maxY: 1.5, keep: [mill.group, screwPivot, fnd],
    faces: [[[-6, 1.0], [-6, 10]], [[14, 1.0], [14, 10]], [[-6, 10], [14, 10]]] });
  return {
    update(dt, t) {
      const om = sails.step(ctx.state.brake ? 0 : sailOmega(ctx.state.wind, 12), dt, ctx.state.brake);
      angle += om * dt;
      mill.update(angle, dt, t);
      screwOmega = om * mill.ratioTop * RATIO_LOW;
      screw.rotation.x = -angle * mill.ratioTop * RATIO_LOW;     // flights carry the water up the race
    },
    readouts: () => {
      const rpm = (w) => (w * 60 / (2 * Math.PI)).toFixed(1) + ' rpm', om = sails.v;
      return [['Sails', rpm(om)], ['Vertical shaft · ×48/26', rpm(om * mill.ratioTop)], ['Screw · ×40/30', rpm(screwOmega)],
              ['Lift', (Y_BOEZEM - Y_POLDER).toFixed(1) + ' m']];
    },
  };
}
</script>
</body>
</html>
