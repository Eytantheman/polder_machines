<script type="module">
import { start, THREE, M, mat, box, beam, cyl, ring, prism, Eased, rand, pick, D2R } from '../common/engine.js';
import * as A from '../common/assets.js';

// Levels from the drawing: polder summer level Z.P. -1.93; the boezem stands higher behind the dike.
const PW = -1.93, PG = -1.45, F = -1.1, BW = -0.45, CREST = 0.85;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const DITCH_X = [-45, -95, -145, -195, -245];
const NX = [-10, 24], NZ = [-6.5, 1.0], PIT = -3.6;      // the section pit, cut along the pipe line
let motor, valve = { v: 0 }, primeRate = 0;

start({
  slug: 'mijzen-1920',
  meta: {
    title: 'Electrisch Gemaal met Woning<br>Polder Mijzen, 1920',
    original: 'Polder Mijzen. Plan Electrisch Gemaal met Woning; Motor en Pompfundering',
    rows: [['Type', 'Electric centrifugal pumping station with machinist\'s house'],
           ['Place', 'Mijzenpolder, Wester-Koggenland (Noord-Holland), founded 1920'],
           ['Makers', 'W.C. & K. de Wit, engineers · Machinefabriek Hoogenlande · Groeneveld v.d. Poll & Co · Joh. Hille, builder'],
           ['Source', 'Noord-Hollands Archief, via watertorens.eu']],
    link: 'https://www.watertorens.eu/Gemalen/Stoomgemalen/1776%20Elektrisch%20gemaal%20Mijzenpolder/Kunst.html',
    linkText: 'View the drawings at watertorens.eu',
  },
  panel: { title: 'Gemaal Mijzen', sub: '1920' },
  controls: [], buttons: [],
  camera: { pos: [3.5, 3.2, -8.5], target: [0.4, -1.4, 0.4], max: 600 },
  shadowSize: 30,
  fog: { color: 0xb3bbbe, near: 30, far: 400 },
  exposure: 0.5,
  waters: [
    { x: [-320, -10], z: [-2.4, 2.4], y: PW, color: 0x2a3a2c, size: 10 },               // tocht to the intake
    { x: [26, 44], z: [-600, 600], y: BW, color: 0x2c4248, size: 14 },                   // boezem
  ],
  ambient: { fish: false, debrisMax: 3 },
  build,
});

function build(ctx) {
  const { scene } = ctx;
  const brick = mat(0x9a4a35, 0.9, 0, 0.35, 9), white = M.white(), stone = M.stone(), conc = mat(0xa8a49a, 0.9, 0, 0.3, 3);
  const iron = mat(0x3d4a44, 0.55, 0.55, 0.05), ironDark = mat(0x2a302c, 0.6, 0.5, 0.05), copper = mat(0xb87333, 0.4, 0.8, 0.05);
  const green = mat(0x2e5a44, 0.6, 0, 0.1), glass = mat(0x24313a, 0.12, 0.5, 0, 1, { envMapIntensity: 1.3 });
  const tileCv = document.createElement('canvas'); tileCv.width = tileCv.height = 128; const tg = tileCv.getContext('2d');
  for (let r = 0; r < 8; r++) for (let c = 0; c < 6; c++) { const v = 150 + Math.random() * 30;
    const grd = tg.createLinearGradient(c * 21.3, 0, c * 21.3 + 21.3, 0); grd.addColorStop(0, `rgb(${v * 0.75},${v * 0.36},${v * 0.22})`); grd.addColorStop(0.6, `rgb(${v},${v * 0.48},${v * 0.3})`); grd.addColorStop(1, `rgb(${v * 0.7},${v * 0.34},${v * 0.2})`);
    tg.fillStyle = grd; tg.fillRect(c * 21.3, r * 16, 21.3, 15); }
  const tileTex = new THREE.CanvasTexture(tileCv); tileTex.wrapS = tileTex.wrapT = THREE.RepeatWrapping; tileTex.colorSpace = THREE.SRGBColorSpace;
  const tiles = new THREE.MeshStandardMaterial({ map: tileTex, roughness: 0.75, side: THREE.DoubleSide });

  const gable = (x0, x1, zA, zB, yE, yR, m) => {       // triangular gable wall between x0 and x1
    const sh = new THREE.Shape([new THREE.Vector2(zA, yE), new THREE.Vector2(zB, yE), new THREE.Vector2((zA + zB) / 2, yR)]);
    const g = new THREE.ExtrudeGeometry(sh, { depth: x1 - x0, bevelEnabled: false }).rotateY(-Math.PI / 2);
    const mesh = new THREE.Mesh(g, m); mesh.position.x = x1; mesh.castShadow = mesh.receiveShadow = true; scene.add(mesh); return mesh;
  };
  // ---------------------------------------------------------------- polder, dike, boezem
  const ground = [];
  const edges = [-320]; for (const x of DITCH_X.slice().sort((a, b) => a - b)) edges.push(x - 1.5, x + 1.5); edges.push(-7.2);
  for (let i = 0; i < edges.length; i += 2) for (const [z0, z1] of [[-2000, -2.4], [2.4, 2000]]) ground.push(A.field(ctx, edges[i], edges[i + 1], z0, z1, PG, pick([0x5d7340, 0x67803f, 0x56703c]), 1.5));
  ground.push(A.field(ctx, -7.2, 5, -2000, -2.4, PG, 0x5d7340, 1.5)); ground.push(A.field(ctx, -7.2, 5, 2.4, 2000, PG, 0x5d7340, 1.5));
  ground.push(A.field(ctx, -3.2, 5, -2.4, 2.4, PG, 0x5d7340, 1.5));
  ground.push(box(scene, mat(0x3a3428, 1, 0, 0.3), -320, 5, -3.6, -2.9, -2000, 2000));   // ditch beds
  box(scene, M.grass(), -2000, -320, -3, PG, -2000, 2000);
  const ditchW = mat(0x27352c, 0.08, 0.2, 0, 1, { envMapIntensity: 1.2 });
  for (const x of DITCH_X) box(scene, ditchW, x - 1.5, x + 1.5, PW - 0.05, PW, -2000, 2000);
  // the dike between polder and boezem, with a road on the crest
  const dikeMat = M.grass();
  ground.push(prism(scene, dikeMat, [[4.5, PG - 0.1], [9, CREST], [13, CREST], [17.5, -2.8], [4.5, -2.8]], -600, 600));
  box(scene, mat(0x4a4a4a, 0.9, 0, 0.3), 9.6, 12.4, CREST, CREST + 0.06, -600, 600);
  box(scene, mat(0x3a3428, 1, 0, 0.3), 16, 46, -3.2, -2.6, -600, 600);
  prism(scene, dikeMat, [[43, -2.8], [47, 0.2], [55, 0.2], [55, -2.8]], -600, 600);
  box(scene, M.grass(), 55, 2000, -3, -0.2, -2000, 2000);
  // the erf (yard) is raised a little around the house
  ground.push(box(scene, mat(0x6f6352, 0.95, 0, 0.3, 2), -4.2, 4.8, PG, PG + 0.25, -3.6, 11));

  // ---------------------------------------------------------------- the section pit: ground cut away along the pipes
  ctx.renderer.localClippingEnabled = true;
  const planes = [new THREE.Plane(V(0, 0, 1), -NZ[1]), new THREE.Plane(V(0, 0, -1), NZ[0]),
                  new THREE.Plane(V(-1, 0, 0), NX[0]), new THREE.Plane(V(1, 0, 0), -NX[1])];
  for (const g of ground) { g.material = g.material.clone(); g.material.clippingPlanes = planes; g.material.clipIntersection = true; g.material.side = THREE.FrontSide; }
  // soil strata for the cut faces: topsoil, peat, blue clay
  const sc = document.createElement('canvas'); sc.width = 4; sc.height = 256; const sg = sc.getContext('2d');
  const band = (y0, y1, col) => { sg.fillStyle = col; sg.fillRect(0, 256 - (y1 + 3.6) / 4.8 * 256, 4, (y1 - y0) / 4.8 * 256); };
  band(-3.6, -2.5, '#8e938b'); band(-2.5, -1.85, '#6e5236'); band(-1.85, -1.55, '#5a4430'); band(-1.55, 1.2, '#a08b66');
  for (let y = 0; y < 256; y += 9) { sg.fillStyle = 'rgba(0,0,0,0.06)'; sg.fillRect(0, y, 4, 2); }
  const soilTex = new THREE.CanvasTexture(sc); soilTex.colorSpace = THREE.SRGBColorSpace;
  const soil = new THREE.MeshStandardMaterial({ map: soilTex, roughness: 0.95, side: THREE.DoubleSide });
  const cap = (pts, place) => {          // pts: [[u, y]] polygon in the cut plane; place maps (u, y) to world
    const g = new THREE.ShapeGeometry(new THREE.Shape(pts.map(([u, y]) => new THREE.Vector2(u, y))));
    const pos = g.attributes.position, uv = g.attributes.uv;
    for (let i = 0; i < pos.count; i++) { const u = pos.getX(i), y = pos.getY(i), w = place(u, y); pos.setXYZ(i, w.x, w.y, w.z); uv.setXY(i, 0.5, (y + 3.6) / 4.8); }
    g.computeVertexNormals(); const m = new THREE.Mesh(g, soil); m.receiveShadow = true; scene.add(m); return m;
  };
  const dikeY = (x) => x < 9 ? PG - 0.1 + (x - 4.5) / 4.5 * (CREST - PG + 0.1) : x < 13 ? CREST : CREST - (x - 13) / 4.5 * (CREST + 2.8);
  const dikeTop = []; for (let x = 4.5; x <= 16.6; x += 0.5) dikeTop.push([x, dikeY(x)]);
  // back wall of the pit, through the pipe line (z = NZ[1])
  cap([[NX[0], PIT], [NX[1], PIT], [NX[1], -2.6], [16.6, -2.6], ...dikeTop.slice().reverse(), [4.5, PG + 0.25], [-3.0, PG + 0.25], [-3.0, -2.9], [NX[0], -2.9]], (u, y) => V(u, y, NZ[1]));
  // front wall (z = NZ[0]) and the two ends
  cap([[NX[0], PIT], [NX[1], PIT], [NX[1], -2.6], [16.6, -2.6], ...dikeTop.slice().reverse(), [NX[0], PG]], (u, y) => V(u, y, NZ[0]));
  cap([[NZ[0], PIT], [NZ[1], PIT], [NZ[1], -2.9], [-2.4, -2.9], [-2.4, PG], [NZ[0], PG]], (u, y) => V(NX[0], y, u));
  cap([[NZ[0], PIT], [NZ[1], PIT], [NZ[1], -2.6], [NZ[0], -2.6]], (u, y) => V(NX[1], y, u));
  box(scene, mat(0x8e938b, 0.95, 0, 0.3, 2), NX[0], NX[1], PIT - 0.1, PIT, NZ[0], NZ[1]);  // floor of the pit (blue clay)
  box(scene, mat(0x3a3428, 1, 0, 0.3), NX[0], -3.0, PIT, -2.9, -2.4, NZ[1]);             // tocht bed, in section
  box(scene, mat(0x3a3428, 1, 0, 0.3), 16.6, NX[1], PIT, -2.6, NZ[0], NZ[1]);            // boezem bed, in section
  // water in section: glassy blocks for the tocht and the boezem
  const wsec = new THREE.MeshPhysicalMaterial({ color: 0x3f7f78, transparent: true, opacity: 0.32, roughness: 0.05, metalness: 0, depthWrite: false, side: THREE.DoubleSide });
  const wtop = new THREE.MeshStandardMaterial({ color: 0x2c4a48, transparent: true, opacity: 0.55, roughness: 0.08, metalness: 0.3, depthWrite: false });
  for (const [x0, x1, y0, y1, z0, z1] of [[NX[0], -3.2, -2.9, PW, -2.4, NZ[1]], [16.6, NX[1], -2.6, BW, NZ[0], NZ[1]]]) {
    box(scene, wsec, x0, x1, y0, y1 - 0.01, z0, z1).castShadow = false;
    const t = box(scene, wtop, x0, x1, y1 - 0.01, y1, z0, z1); t.castShadow = false;
  }
  for (const [x0, x1, z0, z1] of [[-3.2, -3.0, -2.4, NZ[1]]]) box(scene, wsec, x0, x1, -2.9, PW, z0, z1);
  // the dike road crosses the cut as a sectioned deck
  box(scene, conc, 9.4, 12.6, CREST - 0.45, CREST, NZ[0], NZ[1]);

  // ---------------------------------------------------------------- intake: wing walls, trash rack, suction bell
  for (const s of [-1, 1]) {
    beam(scene, brick, V(-3.4, PG - 0.45, s * 2.55), V(-7.4, PG - 0.45, s * 3.95), 0.35, 1.8); beam(scene, stone, V(-3.4, PG + 0.5, s * 2.55), V(-7.4, PG + 0.5, s * 3.95), 0.45, 0.12);
    box(scene, stone, -3.6, -3.2, PG - 1.4, PG + 0.35, s * 2.4 - 0.2, s * 2.4 + 0.2);
  }
  box(scene, brick, -3.4, -3.0, PG - 1.6, PG + 0.3, -2.4, 2.4);
  const rack = new THREE.Group(); scene.add(rack);
  for (let z = -2.2; z <= 2.2; z += 0.18) beam(rack, iron, V(-6.6, PG + 0.2, z), V(-6.0, PW - 1.1, z), 0.04, 0.06);
  beam(rack, iron, V(-6.6, PG + 0.22, -2.3), V(-6.6, PG + 0.22, 2.3), 0.08, 0.1);
  A.plasticRaft(ctx, -7.4, 0.6, PW, 0.8);                                               // what the rack catches
  const bell = cyl(scene, ironDark, V(-5.2, PW - 1.1, 0), V(-5.2, PW - 0.7, 0), 0.55, 20, 0.3);
  const swirl = new THREE.Mesh(new THREE.RingGeometry(0.3, 0.42, 24), new THREE.MeshBasicMaterial({ color: 0xdfe8e4, transparent: true, opacity: 0 }));
  swirl.rotation.x = -Math.PI / 2; swirl.position.set(-5.2, PW + 0.02, 0); scene.add(swirl);

  // ---------------------------------------------------------------- the building
  const EW = [-2.4, 2.4], ED = [-2.8, 2.8], EAVE_E = F + 3.6, RIDGE_E = EAVE_E + 2.6;
  const H0 = -3.0;
  box(scene, conc, -2.75, 5.35, -3.3, -3.0, -3.15, 3.0);                                  // footing under engine and switch room
  // engine room: drawn as a section, with the north wall and north roof slope cut away
  const cutY = F + 1.25;
  box(scene, conc, EW[0] + 0.34, EW[1] - 0.34, H0, F, ED[0] + 0.34, ED[1] - 0.34);                                 // floor slab
  box(scene, brick, EW[0], EW[0] + 0.33, H0, EAVE_E, ED[0], ED[1]);                     // west wall
  box(scene, brick, EW[1] - 0.33, EW[1], H0, EAVE_E, ED[0], ED[1]);                     // east wall
  box(scene, brick, EW[0], EW[1], H0, EAVE_E, ED[1] - 0.33, ED[1]);                     // south wall (shared with house)
  box(scene, brick, EW[0], EW[1], PG, cutY, ED[0], ED[0] + 0.33);                       // north wall, cut (and open below ground)
  box(scene, mat(0xe8dcc6, 0.9, 0, 0.2), EW[0], EW[1], cutY, cutY + 0.02, ED[0], ED[0] + 0.33);
  for (const x of EW) gable(x - 0.165, x + 0.165, ED[0], ED[1], EAVE_E, RIDGE_E, brick);
  // tall arched windows in the west and east walls
  for (const x of [EW[0] - 0.02, EW[1] + 0.02]) for (const z of [-1.2, 1.2]) {
    box(scene, glass, x - 0.03, x + 0.03, F + 0.9, F + 2.9, z - 0.45, z + 0.45);
    for (const yy of [F + 0.9, F + 1.9, F + 2.9]) box(scene, white, x - 0.05, x + 0.05, yy - 0.04, yy + 0.04, z - 0.48, z + 0.48);
    box(scene, white, x - 0.05, x + 0.05, F + 0.9, F + 2.9, z - 0.03, z + 0.03);
    box(scene, stone, x - 0.12, x + 0.12, F + 0.78, F + 0.9, z - 0.55, z + 0.55);
  }
  // roof: south slope tiled, north slope opened to show the king-post trusses
  const slope = (zE, zR, yE, yR, x0, x1, m) => {        // a tiled roof plane from eave (zE, yE) to ridge (zR, yR)
    const L = Math.hypot(zR - zE, yR - yE), W = x1 - x0;
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute([x0, yE, zE, x1, yE, zE, x1, yR, zR, x0, yR, zR], 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute([0, 0, W / 1.3, 0, W / 1.3, L, 0, L], 2));
    g.setIndex([0, 1, 2, 0, 2, 3]); g.computeVertexNormals();
    const mesh = new THREE.Mesh(g, m); mesh.castShadow = mesh.receiveShadow = true; scene.add(mesh); return mesh;
  };
  slope(ED[1] + 0.35, 0, EAVE_E - 0.33, RIDGE_E + 0.05, EW[0] - 0.3, EW[1] + 0.3, tiles);
  const pine = mat(0xa7835a, 0.8, 0, 0.2);
  for (const x of [-1.2, 0, 1.2]) {                                                       // king-post trusses
    const tr = (a, b, w = 0.12, h = 0.16) => beam(scene, pine, a, b, w, h);
    tr(V(x, EAVE_E, ED[0] + 0.2), V(x, EAVE_E, ED[1] - 0.2), 0.14, 0.2);
    tr(V(x, EAVE_E, ED[0] + 0.2), V(x, RIDGE_E - 0.15, 0)); tr(V(x, EAVE_E, ED[1] - 0.2), V(x, RIDGE_E - 0.15, 0));
    tr(V(x, EAVE_E, 0), V(x, RIDGE_E - 0.15, 0), 0.12, 0.12);
    tr(V(x, EAVE_E + 0.2, 0), V(x, EAVE_E + 1.2, -1.2), 0.08, 0.1); tr(V(x, EAVE_E + 0.2, 0), V(x, EAVE_E + 1.2, 1.2), 0.08, 0.1);
  }
  for (const t of [0.33, 0.66]) for (const s of [-1, 1]) beam(scene, pine, V(EW[0] + 0.15, EAVE_E + 0.1 + t * 2.5, s * 2.8 * (1 - t)), V(EW[1] - 0.15, EAVE_E + 0.1 + t * 2.5, s * 2.8 * (1 - t)), 0.1, 0.14);
  beam(scene, pine, V(EW[0] + 0.15, RIDGE_E - 0.1, 0), V(EW[1] - 0.15, RIDGE_E - 0.1, 0), 0.1, 0.18);
  beam(scene, mat(0x2c2c2c, 0.6, 0.6, 0.05), V(EW[0] + 0.3, EAVE_E - 0.25, -0.6), V(EW[1] - 0.3, EAVE_E - 0.25, -0.6), 0.12, 0.2);   // hoist beam
  cyl(scene, mat(0x2c2c2c, 0.6, 0.6, 0.05), V(-0.5, EAVE_E - 0.35, -0.6), V(-0.5, F + 2.4, -0.6), 0.025, 5);

  // switch room on the dike side, flat-roofed, where the 10 kV line comes in
  box(scene, brick, 2.4, 5.0, PG, F + 3.0, -1.7, 1.7);
  box(scene, brick, 4.67, 5.0, H0, PG, -1.7, 1.7); box(scene, brick, 2.4, 5.0, H0, PG, 1.37, 1.7);
  box(scene, white, 2.35, 5.15, F + 3.0, F + 3.2, -1.85, 1.85);
  box(scene, green, 4.98, 5.04, F, F + 2.2, -0.5, 0.5);
  for (const z of [-0.6, 0, 0.6]) { cyl(scene, white, V(3.8 + z, F + 3.2, -1.2), V(3.8 + z, F + 3.6, -1.2), 0.07, 8); }

  // the machinist's house, attached to the south
  const HX = [-3.4, 3.4], HZ = [2.8, 9.2], EAVE_H = PG + 2.9, RIDGE_H = EAVE_H + 2.6;
  box(scene, brick, HX[0], HX[1], H0, EAVE_H, HZ[0], HZ[1]);
  for (const x of HX) gable(x - 0.15, x + 0.15, HZ[0], HZ[1], EAVE_H, RIDGE_H, brick);
  const zm = (HZ[0] + HZ[1]) / 2;
  slope(HZ[0] - 0.35, zm, EAVE_H - 0.3, RIDGE_H + 0.05, HX[0] - 0.25, HX[1] + 0.25, tiles);
  slope(HZ[1] + 0.35, zm, EAVE_H - 0.3, RIDGE_H + 0.05, HX[0] - 0.25, HX[1] + 0.25, tiles);
  box(scene, white, HX[0] - 0.25, HX[1] + 0.25, EAVE_H - 0.2, EAVE_H, HZ[1] + 0.05, HZ[1] + 0.35);
  box(scene, brick, 1.1, 1.7, RIDGE_H - 1, RIDGE_H + 0.9, zm - 0.3, zm + 0.3);
  ctx.smoke({ pos: V(1.4, RIDGE_H + 1, zm), count: 50, rate: () => 2.2, life: 6, size0: 0.4, size1: 3, color: 0xdedede, opacity: 0.35, vel: V(0.6, 1.2, 0.2), drift: 0.2, jitter: 0.2 });
  const houseWin = (x, z, nx, nz, w = 0.9, h = 1.3, y = PG + 0.95, shutters = true) => {
    const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = Math.atan2(nx, nz); scene.add(g);
    box(g, glass, -w / 2, w / 2, 0, h, -0.02, 0.04);
    for (const yy of [0, h / 2, h]) box(g, white, -w / 2 - 0.05, w / 2 + 0.05, yy - 0.04, yy + 0.04, 0, 0.08);
    for (const xx of [-w / 2, 0, w / 2]) box(g, white, xx - 0.04, xx + 0.04, 0, h, 0, 0.08);
    if (shutters) for (const s of [-1, 1]) { box(g, green, s * (w / 2 + 0.06), s * (w / 2 + 0.5), 0, h, 0.02, 0.07);
      box(g, white, s * (w / 2 + 0.06), s * (w / 2 + 0.5), h * 0.48, h * 0.52, 0.07, 0.09); }
  };
  for (const x of [-2.1, 0, 2.1]) houseWin(x, HZ[1] + 0.02, 0, 1);                    // the zijgevel: three windows
  houseWin(HX[0] - 0.02, 4.2, -1, 0); houseWin(HX[0] - 0.02, 8.0, -1, 0);               // the voorgevel
  houseWin(HX[0] - 0.17, zm, -1, 0, 0.6, 0.7, EAVE_H + 0.4, false);
  box(scene, green, HX[0] - 0.06, HX[0], PG + 0.25, PG + 2.3, 5.6, 6.6);                // front door
  box(scene, stone, HX[0] - 0.5, HX[0], PG + 0.25, PG + 0.4, 5.4, 6.8);
  houseWin(HX[1] + 0.02, 6.4, 1, 0);
  // washing line in the yard

  A.reeds(ctx, [[-90, -2.6, -8, -2.6], [-90, 2.6, -8, 2.6], [-46.7, -60, -46.7, -4], [-43.3, 4, -43.3, 60], [17.2, -60, 17.2, -13], [17.2, 6, 17.2, 60]], PG + 0.1);
  A.cows(ctx, [-90, -50, 10, 70], PG, 8);
  A.cows(ctx, [-140, -100, -80, -10], PG, 6);
  A.tractor(ctx, [-190, -150, 10, 120], PG);
  A.heron(ctx, -8.6, -2.2, PW + 0.1, 0.7);
  A.storkNest(ctx, -24, 16, PG);
  A.waterfowl(ctx, [18, 42, -200, 200], BW, 7, 'duck');
  A.waterfowl(ctx, [18, 42, -150, 150], BW, 3, 'swan');
  A.waterfowl(ctx, [-300, -10, -2.2, 2.2], PW, 3, 'coot');
  A.cyclists(ctx, [[11, CREST, -600], [11, CREST, 600]], CREST + 0.06, 4, 4.8, { cargo: true });
  A.traffic(ctx, [[11, 0, -900], [11, 0, 900]], CREST + 0.06, 3, 14, { lanes: [-0.7, 0.7] });
  A.ship(ctx, 'tjalk', [[30, 0, -700], [30, 0, 700], [26, 0, 700], [26, 0, -700]], BW, 2.2, { scale: 0.8 });
  A.plasticRaft(ctx, 34, 70, BW, 1.2);
  A.windTurbines(ctx, [[260, -420], [260, -180], [260, 60], [260, 300]], { h: 95, r: 50 });
  A.pylons(ctx, [[-420, -900], [-420, -450], [-420, 0], [-420, 450], [-420, 900]], 44);
  A.solarField(ctx, -300, -205, 40, 160, PG, 10);
  // a contemporary sensor buoy and a level gauge where the tocht meets the intake
  box(scene, white, -7.9, -7.75, PW - 1, PW + 1.4, -2.3, -2.15);
  for (let y = PW - 0.8; y < PW + 1.3; y += 0.2) box(scene, mat(0x1a1a1a), -7.95, -7.9, y, y + 0.03, -2.3, -2.2);
  const buoy = new THREE.Group(); buoy.position.set(-22, PW, 0); scene.add(buoy);
  cyl(buoy, mat(0xe6c229, 0.5, 0.1, 0.05), V(0, -0.2, 0), V(0, 0.35, 0), 0.25, 14); cyl(buoy, mat(0x222222), V(0, 0.35, 0), V(0, 0.9, 0), 0.03, 6);
  const blink = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 6), new THREE.MeshBasicMaterial({ color: 0x55ff88 })); blink.position.y = 0.95; buoy.add(blink);

  // ---------------------------------------------------------------- fog and a distant thunderstorm
  const FOG = new THREE.Color(0xb3bbbe), FLASH = new THREE.Color(0xe9eef8);
  scene.fog = new THREE.FogExp2(FOG.clone(), 0.017); scene.background = FOG.clone(); ctx.sky.visible = false;
  scene.environmentIntensity = 0.55; ctx.sunLight.intensity = 0.9; ctx.sunLight.color.set(0xdfe5ea);
  for (const w of ctx.waters) { w.material.uniforms.sunColor.value.set(0x3a3a3a); w.material.uniforms.distortionScale.value = 0.15; }
  const flashLight = new THREE.HemisphereLight(0xdfe8ff, 0x8090a0, 0); scene.add(flashLight);
  const boltMat = new THREE.MeshBasicMaterial({ color: 0xf4f6ff, transparent: true, opacity: 0, fog: false, depthWrite: false });
  const glowMat = new THREE.MeshBasicMaterial({ color: 0xbfd0ff, transparent: true, opacity: 0, fog: false, depthWrite: false, blending: THREE.AdditiveBlending });
  let strike = null, nextStrike = 4 + rand(0, 5), strikeT = -1, withBolt = true;
  const makeBolt = () => {
    if (strike) { scene.remove(strike); strike.traverse(m => m.geometry && m.geometry.dispose()); }
    const cam = ctx.camera.position, tgt = ctx.controls.target;
    const fwd = tgt.clone().sub(cam).setY(0).normalize(), a = Math.atan2(fwd.z, fwd.x) + rand(-0.9, 0.9), d = rand(130, 230);
    const base = V(tgt.x + Math.cos(a) * d, PG, tgt.z + Math.sin(a) * d);
    strike = new THREE.Group(); scene.add(strike);
    const branch = (p0, len, dir, r, depth) => {
      const pts = [p0.clone()]; let p = p0.clone();
      for (let i = 0; i < 14; i++) { p = p.clone().add(V(dir.x * len / 14 + rand(-1, 1) * len * 0.05, -len / 14, dir.z * len / 14 + rand(-1, 1) * len * 0.05)); pts.push(p); }
      const curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.1);
      strike.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 60, r, 5, false), boltMat));
      strike.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 30, r * 5, 6, false), glowMat));
      if (depth > 0) for (let k = 0; k < 2; k++) { const at = pts[3 + Math.floor(rand(0, 8))]; branch(at, len * rand(0.25, 0.45), V(rand(-0.6, 0.6), 0, rand(-0.6, 0.6)), r * 0.5, depth - 1); }
    };
    branch(base.clone().setY(PG + 150), 150, V(rand(-0.15, 0.15), 0, rand(-0.15, 0.15)), 0.35, 2);
  };
  const flashCurve = (u) => u < 0.07 ? 1 : u < 0.13 ? 0.15 : u < 0.3 ? 0.9 : u < 0.36 ? 0.3 : u < 0.42 ? 0.6 : Math.max(0, 1 - (u - 0.42) / 0.5) * 0.4;
  ctx.add((dt) => {
    nextStrike -= dt;
    if (nextStrike <= 0) { withBolt = Math.random() < 0.7; if (withBolt) makeBolt(); strikeT = 0; nextStrike = rand(9, 24); }
    let f = 0;
    if (strikeT >= 0) { strikeT += dt; const u = strikeT / 1.1; if (u > 1) strikeT = -1; else f = flashCurve(u); }
    flashLight.intensity = f * 3.2;
    scene.background.copy(FOG).lerp(FLASH, f * 0.75); scene.fog.color.copy(scene.background);
    boltMat.opacity = withBolt ? Math.min(1, f * 1.4) : 0; glowMat.opacity = withBolt ? f * 0.35 : 0;
  });

  // ---------------------------------------------------------------- the pumping cycle
  motor = new Eased(0.5, 0.35); const prime = new Eased(2.5, 2.5); valve = new Eased(0.6, 0.6);
  const CYCLE = 75, T0 = +new URLSearchParams(location.search).get('t0') || 0;
  let ang = 0, flapA = 0, ppAng = 0, level = 0;
  return {
    update(dt, t) {
      const c = (t + T0) % CYCLE, priming = c > 2 && c < 10, on = c > 9 && c < 54;
      prime.step(priming ? 1 : 0, dt); motor.step(on ? 1 : 0, dt);
      const v = motor.v;
      ang += dt * v * 11; spin.rotation.z = ang; fan.rotation.z = ang;
      ppAng += dt * prime.v * 30; ppFan.rotation.z = ppAng; primeRate = c > 7 && c < 10 ? 25 : 0;
      const vOpen = c > 12 && c < 50 ? 1 : 0, before = valve.v; valve.step(vOpen, dt);
      wheel.rotation.y += (valve.v - before) * 40; spindle.position.y = valve.v * 0.35;
      lever.rotation.z = -0.7 * Math.min(1, v * valve.v * 1.3);
      level += ((on && v > 0.5 ? -0.12 : 0.06) * dt / 30); level = Math.max(-0.12, Math.min(0, level));
      floatRod.position.y = PG + 0.9 + level * 3; pointer.position.set(-2.52, F + 2.0 + level * 4, -1.72);
      flapA += ((v * valve.v > 0.25 ? 0.75 * Math.min(1, v * valve.v * 1.2) : 0) - flapA) * Math.min(1, dt * 3);
      flap.rotation.z = flapA;
      boil.material.opacity = 0.4 * v * valve.v; boil.scale.setScalar(0.8 + 0.3 * Math.sin(t * 5) * v);
      swirl.material.opacity = 0.5 * v; swirl.rotation.z = -t * 4; swirl.scale.setScalar(1 + 0.4 * Math.sin(t * 3));
      amm.rotation.z = 1.1 - 2.0 * v + 0.03 * Math.sin(t * 13) * v; volt.rotation.z = 1.1 - 1.6 * (on ? 1 : v * 0.98);
      gVac.rotation.z = 1.0 - 1.2 * v; gPres.rotation.z = 1.0 - (0.6 + 0.9 * valve.v) * v;
      handle.rotation.z = on ? 0 : 0.8;
      lamp.material.emissiveIntensity = on ? 2.2 : 0;
      blink.visible = Math.sin(t * 4) > 0.6;
      for (const [i, l] of laundry.entries()) l.rotation.x = 0.25 + 0.15 * Math.sin(t * 2.1 + i);
    },
    readouts: () => [],
  };
}
