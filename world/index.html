               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }

<style>
  #hud { position:absolute; right:16px; top:92px; width:290px; display:flex; flex-direction:column; gap:10px; font-family:"IBM Plex Sans", system-ui, sans-serif; }
  .card { background:rgba(12,18,22,.72); color:#e8eef0; border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:12px 14px; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
  .card h3 { margin:0 0 8px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:#8fd3c4; font-weight:600; }
  #minimap { width:100%; aspect-ratio:1; display:block; border-radius:8px; cursor:pointer; background:#0b1114; }
  .go { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
  .go button { font:inherit; font-size:11px; padding:4px 9px; border-radius:999px; cursor:pointer; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.06); color:#e8eef0; }
  .go button:hover { background:rgba(143,211,196,.25); }
  .node { display:grid; grid-template-columns:1fr auto; font-size:12px; margin:5px 0 2px; gap:2px 8px; }
  .node .v { font-family:"IBM Plex Mono", monospace; }
  .bar { grid-column:1 / -1; position:relative; height:5px; background:rgba(255,255,255,.1); border-radius:3px; overflow:hidden; }
  .bar i { position:absolute; left:0; top:0; bottom:0; border-radius:3px; background:#4fb3a1; transition:width .3s, background .3s; }
  .bar b { position:absolute; top:-1px; bottom:-1px; width:2px; background:#fff; opacity:.8; }
  .st { grid-column:1 / -1; font-size:10.5px; color:#9fb0b5; }
  #log { font-family:"IBM Plex Mono", monospace; font-size:10.5px; line-height:1.5; max-height:150px; overflow:hidden; color:#cfe3df; }
  #log div.warn { color:#ffcf7a; } #log div.alarm { color:#ff8a7a; }
  #flash { position:absolute; inset:0; background:#eef4ff; opacity:0; pointer-events:none; }
  @media (max-width:900px) { #hud { display:none; } }

<body>
<div id="flash"></div>
<div id="hud">
  <div class="card"><h3>Map</h3><canvas id="minimap" width="520" height="520"></canvas>
    <div class="go" id="go"></div></div>
  <div class="card"><h3>Water levels (m)</h3><div id="nodes"></div></div>
  <div class="card"><h3>Control log</h3><div id="log"></div></div>
</div>
<script type="module">
import { start, THREE, M, mat, box, cyl, ring, rand, pick, beaufort, makeWaterNormals } from '../common/engine.js';
import * as A from '../common/assets.js';
import * as MC from '../common/machines.js';

// ------------------------------------------------------------------ world layout
const SEA_X = 617;
const NODES = {
  sea: { name: 'Zuiderzee', h: -0.3, target: -0.3, lo: -1.2, hi: 2.4, color: 0x173c44 },
  B:   { name: 'Boezem (shared canals)', h: -0.4, target: -0.4, lo: -1.0, hi: 0.4, max: -0.1, color: 0x163a36 },
  A:   { name: 'Polder Schermer', h: -1.55, target: -1.6, lo: -2.4, hi: -0.6, color: 0x15352a },
  Bv:  { name: 'Polder Buitenveldert', h: -2.25, target: -2.3, lo: -3.1, hi: -1.3, color: 0x15352a },
  C:   { name: 'Polder Monnickendam', h: -1.15, target: -1.2, lo: -2.0, hi: -0.2, color: 0x15352a },
  D:   { name: 'Polder Zaandam', h: -0.95, target: -1.0, lo: -1.8, hi: 0.0, color: 0x15352a },
  L:   { name: 'Haarlemmermeer', h: -2.2, target: -4.6, lo: -5.0, hi: -1.6, color: 0x173a3c },
};
const RECTS = {
  B: [[-560, 583, -12, 12], [-294, -262, -560, -12], [380, 419, -560, -12], [130, 194, 12, 560], [-436, -398, 12, 700], [-184, -120, 12, 260]],
  sea: [[SEA_X, 4000, -4000, 4000]],
  A: [[-560, -306, -560, -60]], Bv: [[206, 560, 150, 560]], C: [[422, 560, -560, -120]], D: [[-385, -216, 40, 280]], L: [[-800, -484, 100, 700]],
};
const SITES = {
  schermerhorn: { x: -300, y: -1.0, z: -380, cam: [[-27, 8, 30], [-4.6, 4.5, -5.8]], label: 'Schermerhorn' },
  leeghwater:   { x: -460, y: -1.2, z: 380, cam: [[-44, 17, 42], [-5.5, 8, -5.8]], label: 'Leeghwater' },
  zaandam:      { x: -200, y: -0.4, z: 150, cam: [[-34, 17, 38], [0, 1, -2]], label: 'Zaandam' },
  buitenveldert:{ x: 200, y: -0.9, z: 380, cam: [[24, 6.5, 30], [-1.6, 3.2, 3.8]], label: 'Buitenveldert' },
  monnickendam: { x: 420, y: -1.21, z: -300, cam: [[-6.4, 3.4, 10.6], [-0.9, 2.2, 0]], label: 'Monnickendam' },
  muiden:       { x: 600, y: -0.3, z: 0, cam: [[-30, 12, 26], [-5.4, 1.5, -3.7]], label: 'Muiden' },
};
const HUB = new THREE.Vector3(-20, 0.4, -170);
const inR = (r, x, z) => x >= r[0] && x <= r[1] && z >= r[2] && z <= r[3];
const nodeAt = (x, z) => { for (const k of ['B', 'A', 'Bv', 'C', 'D', 'L', 'sea']) for (const r of RECTS[k]) if (inR(r, x, z)) return k; return null; };

// cheap value noise for terrain variation
const hash = (x, z) => { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); };
const vnoise = (x, z) => { const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi, u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  return (hash(xi, zi) * (1 - u) + hash(xi + 1, zi) * u) * (1 - v) + (hash(xi, zi + 1) * (1 - u) + hash(xi + 1, zi + 1) * u) * v; };
const fbm = (x, z) => 0.6 * vnoise(x, z) + 0.3 * vnoise(x * 2.1, z * 2.1) + 0.1 * vnoise(x * 4.3, z * 4.3);

function terrainH(x, z) {
  if (x >= SEA_X) return -5.5 + Math.min(4, (x - SEA_X) * -0.0);
  if (x >= 572) {                                                       // sea dike, cut by the lock
    if (Math.abs(z) < 4.6 && x > 572) return -3;
    if (Math.abs(z) < 42) return 1.9;
    return x > 610 ? 2.3 - (x - 610) * 0.4 : 2.3;
  }
  if (x > -216 && x < -184 && z > 146 && z < 154) return -3;            // Zaandam lock
  if (x > -314 && x < -286 && z > -385.5 && z < -381.5) return -2.2;    // Schermerhorn wheel race
  if (x > 200 && x < 215 && z > 377.5 && z < 382.5) return -3.0;         // Buitenveldert screw race
  const k = nodeAt(x, z);
  if (k === 'B') return -3;
  if (k === 'L') { const [x0, x1, z0, z1] = RECTS.L[0]; if (x - x0 < 4 || x1 - x < 4 || z - z0 < 4 || z1 - z < 4) return 0.4; return -4.95 + 0.9 * fbm(x * 0.012, z * 0.012); }
  if (k && k !== 'sea') {
    const [x0, x1, z0, z1] = RECTS[k][0], n = NODES[k];
    if (x - x0 < 5 || x1 - x < 5 || z - z0 < 5 || z1 - z < 5) return 0.5;          // ring dike (kade)
    if (k === 'D' && z > 142 && z < 158) return n.target - 1.5;                     // polder canal to the lock
    const along = k === 'Bv' ? x : z;
    if (((along % 32) + 32) % 32 < 5) return n.target - 1.0;                        // ditches every 32 m
    return n.target + 0.45 + 0.08 * fbm(x * 0.05, z * 0.05);
  }
  return 0.4 + 0.15 * fbm(x * 0.02, z * 0.02);
}

let world;
const ctxRef = {};

start({
  slug: 'world',
  meta: {
    title: 'Polder machines<br>The control world',
    original: 'No one is left to work the mills. The water is still managed.',
    rows: [['Network', 'One sea, one shared boezem, four polders and a lake being drained'],
           ['Control', 'Automated: pumping stops, low-tide sluicing, storm closure, lock scheduling'],
           ['Machines', 'Six drawings from the Provinciale Atlas Noord-Holland, 1811–1843']],
    link: '../', linkText: 'All machines',
  },
  panel: { title: 'The control world', sub: 'All six machines on one water network · drag, scroll, or fly',
    note: 'Rain fills the polders. The mills and the steam engine pump into the shared boezem, and the Muiden sluice lets the boezem out to sea at low tide. When the boezem is too full, the controller declares a pumping stop (maalstop). In a storm surge the sea gates stay shut.' },
  controls: [{ key: 'sim', label: 'Simulation speed', min: 0.5, max: 6, step: 0.5, value: 1.5, unit: '×', fmt: v => v.toFixed(1), hint: () => '' }],
  buttons: [
    { key: 'autoW', label: 'Auto weather', pressed: true },
    { label: 'Clear', onClick: () => world.setWeather('clear') },
    { label: 'Rain', onClick: () => world.setWeather('rain') },
    { label: 'Storm', onClick: () => world.setWeather('storm') },
    { label: 'Fog', onClick: () => world.setWeather('fog') },
    { label: 'Drought', onClick: () => world.setWeather('drought') },
  ],
  camera: { pos: [-430, 300, 700], target: [-80, 0, 40], min: 3, max: 2600 },
  fov: 42, shadowSize: 70,
  fog: { color: 0xbcc8cf, near: 900, far: 5200 },
  waters: [],
  ambient: { whale: true, whaleCenter: [900, 0, 0], debrisMax: 8 },
  build: (ctx) => { world = buildWorld(ctx); return world; },
});

function buildWorld(ctx) {
  const { scene, camera, controls, state } = ctx;
  state.wind = 6;

  // ---------------------------------------------------------------- terrain
  const SIZE = 1700, SEG = 425;
  const tg = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG).rotateX(-Math.PI / 2);
  const tp = tg.attributes.position, cols = [], c = new THREE.Color();
  for (let i = 0; i < tp.count; i++) {
    const x = tp.getX(i), z = tp.getZ(i), y = terrainH(x, z); tp.setY(i, y);
    const k = nodeAt(x, z), n = fbm(x * 0.03, z * 0.03);
    if (x >= 572) c.setHex(y > 1.5 ? 0x6f7f45 : 0x9c9278);
    else if (y < -2.5) c.setHex(0x3b3528);
    else if (k === 'L') c.setHex(y < -4.0 ? 0x4a4434 : 0x6b6f3e);
    else if (k && k !== 'B') { const parcel = Math.floor((k === 'Bv' ? x : z) / 32); c.setHex([0x5f7a3c, 0x67823f, 0x58723a, 0x6f8443][(parcel % 4 + 4) % 4]); if (y < NODES[k].target) c.setHex(0x3c3a2a); }
    else c.setHex(0x627a3e);
    c.multiplyScalar(0.85 + n * 0.3); cols.push(c.r, c.g, c.b);
  }
  tg.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3)); tg.computeVertexNormals();
  const terrain = new THREE.Mesh(tg, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, metalness: 0 }));
  terrain.receiveShadow = true; scene.add(terrain);
  // far ground ring so the horizon is not the edge of the world
  const farM = new THREE.MeshStandardMaterial({ color: 0x5b6f3c, roughness: 1 });
  for (const [x0, x1, z0, z1] of [[-9000, -850, -9000, 9000], [-850, SEA_X, -9000, -850], [-850, SEA_X, 850, 9000]]) {
    const f = new THREE.Mesh(new THREE.PlaneGeometry(x1 - x0, z1 - z0).rotateX(-Math.PI / 2), farM); f.position.set((x0 + x1) / 2, 0.3, (z0 + z1) / 2); scene.add(f); }

  // ---------------------------------------------------------------- water bodies (one material per node, moving levels)
  const normals = makeWaterNormals(); normals.repeat.set(1, 1);
  const waterMeshes = [];
  for (const [k, rects] of Object.entries(RECTS)) {
    const n = NODES[k];
    n.mat = new THREE.MeshStandardMaterial({ color: n.color, roughness: 0.1, metalness: 0.05, normalMap: normals, normalScale: new THREE.Vector2(0.5, 0.5),
      envMapIntensity: 1.1, transparent: true, opacity: 0.93 });
    n.meshes = rects.map(r => {
      const w = Math.min(r[1], 4000) - r[0], d = r[3] - r[2];
      const geo = new THREE.PlaneGeometry(w, d).rotateX(-Math.PI / 2);
      const uv = geo.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * w / 9, uv.getY(i) * d / 9);
      const m = new THREE.Mesh(geo, n.mat); m.position.set(r[0] + w / 2, n.h, (r[2] + r[3]) / 2); m.receiveShadow = true;
      m.userData = { node: k, rect: r, rough: k === 'sea' ? 2 : 1 }; scene.add(m); waterMeshes.push(m); return m;
    });
  }
  const exclusionsR = Object.values(SITES).map(s => [s.x, s.z, 34]);
  ctx.waterAt = (x, z, margin = 0) => {
    for (const [ex, ez, r] of exclusionsR) if (Math.hypot(x - ex, z - ez) < r) return null;
    const k = nodeAt(x, z); if (!k) return null;
    const n = NODES[k];
    if (terrainH(x, z) > n.h - 0.05 || terrainH(x + margin, z) > n.h || terrainH(x - margin, z) > n.h) return null;
    return n.meshes.find(m => inR(m.userData.rect, x, z)) || null;
  };

  // ---------------------------------------------------------------- the six machines
  const transfers = { muiden: 0, zaandam: 0 };
  const hook = { transfer: (k) => { transfers[k]++; } };
  const mach = {
    schermerhorn: MC.schermerhorn(ctx, SITES.schermerhorn),
    leeghwater: MC.leeghwater(ctx, SITES.leeghwater),
    zaandam: MC.zaandam(ctx, SITES.zaandam, hook),
    buitenveldert: MC.buitenveldert(ctx, SITES.buitenveldert),
    monnickendam: MC.monnickendam(ctx, SITES.monnickendam),
    muiden: MC.muiden(ctx, SITES.muiden, hook),
  };
  for (const m of Object.values(mach)) m.out = 0;
  // an autonomous electric pump for the Zaandam polder (no machine in the archive drained it)
  const ep = new THREE.Group(); ep.position.set(-232, 0.4, 70); scene.add(ep);
  box(ep, mat(0x2b2f33, 0.4, 0.4, 0.02), -5, 5, 0, 4.5, -4, 4); box(ep, mat(0xd8dde0, 0.4, 0.2, 0.02), -5.2, 5.2, 4.5, 4.8, -4.2, 4.2);
  const epLed = new THREE.Mesh(new THREE.BoxGeometry(10.1, 0.25, 0.1), new THREE.MeshBasicMaterial({ color: 0x29d0ff })); epLed.position.set(0, 3.6, 4.05); ep.add(epLed);
  const epOut = ctx.smoke({ pos: new THREE.Vector3(-226, 0, 70), count: 60, rate: () => 0, life: 1, size0: 0.3, size1: 1.4, color: 0xffffff, opacity: 0.55, vel: new THREE.Vector3(1.6, 0.6, 0), gravity: 3, drift: 0, spread: 1.2, jitter: 0.5 });

  // ---------------------------------------------------------------- control network: hub, sensors, data links
  const hub = new THREE.Group(); hub.position.copy(HUB); scene.add(hub);
  box(hub, mat(0x0d1012, 0.15, 0.6, 0.02, 1, { envMapIntensity: 1.6 }), -5, 5, 0, 64, -5, 5);
  const hubRing = new THREE.Mesh(new THREE.TorusGeometry(7.5, 0.35, 8, 48), new THREE.MeshBasicMaterial({ color: 0x8fd3c4 })); hubRing.rotation.x = Math.PI / 2; hubRing.position.y = 40; hub.add(hubRing);
  A.dataCenter(ctx, HUB.x + 40, HUB.z - 10, 60, 28, 0.2);
  const links = [];
  for (const [k, s] of Object.entries(SITES)) {
    const a = HUB.clone().add(new THREE.Vector3(0, 64, 0)), b = new THREE.Vector3(s.x, 40, s.z);
    const mid = a.clone().lerp(b, 0.5); mid.y += 120;
    const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
    const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(48)), new THREE.LineBasicMaterial({ color: 0x8fd3c4, transparent: true, opacity: 0.35 }));
    scene.add(line);
    const pulses = [0, 0.33, 0.66].map(p => { const m = new THREE.Mesh(new THREE.SphereGeometry(1.6, 8, 6), new THREE.MeshBasicMaterial({ color: 0x8fd3c4 })); scene.add(m); return { m, p }; });
    const beacon = new THREE.Mesh(new THREE.SphereGeometry(1.4, 10, 8), new THREE.MeshBasicMaterial({ color: 0x8fd3c4 })); beacon.position.copy(b); scene.add(beacon);
    cyl(scene, mat(0x2b2f33, 0.4, 0.5, 0.02), [s.x, 0, s.z + 26], [s.x, 40, s.z + 26], 0.25, 6).position.set(s.x, 20 + 0.2, s.z);   // mast
    links.push({ k, curve, line, pulses, beacon });
  }
  // level sensors (peilschalen) on each water body, with a ring of light riding the surface
  const sensors = [];
  for (const [k, pos] of Object.entries({ sea: [640, 60], B: [0, 10.5], A: [-430, -64], Bv: [380, 154], C: [500, -124], D: [-300, 44], L: [-600, 104] })) {
    const g = new THREE.Group(); g.position.set(pos[0], 0, pos[1]); scene.add(g);
    cyl(g, M.white(), [0, -5, 0], [0, 6, 0], 0.18, 8);
    for (let y = -5; y < 6; y += 0.5) box(g, mat(y % 1 === 0 ? 0xc0392b : 0x111111, 0.6, 0, 0), 0.18, 0.5, y, y + 0.25, -0.12, 0.12);
    const r = new THREE.Mesh(new THREE.TorusGeometry(0.6, 0.08, 6, 20), new THREE.MeshBasicMaterial({ color: 0x8fd3c4 })); r.rotation.x = Math.PI / 2; g.add(r);
    sensors.push({ k, r });
  }

  // ---------------------------------------------------------------- the wider world: nature, relics, autonomous technology
  // props that float or wade in a water body ride along with its level
  const follow = {};
  const onWater = (k) => { const grp = new THREE.Group(); scene.add(grp); const p = Object.create(ctx); p.scene = grp; follow[k] = { grp, h0: NODES[k].h }; return p; };
  const cB = onWater('B'), cL = onWater('L'), cS = onWater('sea');
  A.windTurbines(ctx, [[1100, -700], [1100, -350], [1100, 0], [1100, 350], [1100, 700], [1400, -525], [1400, -175], [1400, 175], [1400, 525]], { h: 110, r: 60, offshore: true });
  A.windTurbines(ctx, [[540, -760], [540, 760], [-700, -760], [-760, 820], [250, -780]], { h: 95, r: 50 });
  A.ship(cS, 'container', [[1250, 0, -3000], [1250, 0, 3000]], 0.2, 7, { loop: true });
  A.ship(cB, 'roboat', [[-540, 0, 0], [560, 0, 4], [560, 0, -4], [-540, 0, -4]], NODES.B.h, 2.2, { scale: 1.4 });
  A.ship(cB, 'roboat', [[160, 0, 40], [160, 0, 540], [166, 0, 540], [166, 0, 40]], NODES.B.h, 1.6, { scale: 1.3 });
  A.solarField(ctx, 230, 330, 470, 545, NODES.Bv.target + 0.45);
  A.towers(ctx, [[260, 700, 30, 26, 110], [310, 690, 26, 26, 90, 0x9fb2b8], [360, 720, 34, 24, 125, 0x6f8a99], [420, 700, 28, 28, 75, 0xb8c2c6], [200, 730, 24, 24, 95, 0x7d8f86]]);
  A.crane(ctx, 330, 650, 80, 55);
  A.drone(ctx, { center: [-300, 0, -380], radius: 40, h: 26 });
  A.drone(ctx, { center: [600, 0, 0], radius: 50, h: 22, parcel: true });
  A.drone(ctx, { center: [-460, 0, 380], radius: 60, h: 35 });
  A.drone(ctx, { center: [0, 0, 0], radius: 300, h: 60, speed: 0.04 });
  A.airplane(ctx, { landing: true, heading: Math.PI, offset: [100, 300], alt0: 380, alt1: 120, speed: 75, every: [25, 50], first: [8, 14], size: 1.3 });
  A.smallMill(ctx, -520, -250, NODES.A.target + 0.45, 1, 'polder', 0);
  A.smallMill(ctx, -380, -520, NODES.A.target + 0.45, 1, 'polder', 0);
  A.smallMill(ctx, -350, 260, NODES.D.target + 0.45, 0.9, 'paltrok', 0);
  A.cows(ctx, [-540, -330, -540, -420], NODES.A.target + 0.45, 10);
  A.storkNest(ctx, -440, -300, NODES.A.target + 0.45);
  A.heron(cB, -265, -200, NODES.B.h - 0.35, 1.5);
  A.heron(cB, 186, 300, NODES.B.h - 0.35, 3.0);
  A.waterfowl(cB, [-500, 500, -10, 10], NODES.B.h, 10, 'duck');
  A.waterfowl(cB, [-180, -124, 20, 250], NODES.B.h, 4, 'swan');
  A.waterfowl(cL, [-780, -500, 120, 680], NODES.L.h, 8, 'coot');
  A.seals(cS, [630, 820, -200, 200], 0.2, 4);
  A.beaver(cB, [[-430, 0, 100], [-404, 0, 600], [-430, 0, 650], [-404, 0, 150]], NODES.B.h);
  A.oilSlick(cS, 760, 120, 0.2, 14);
  A.plasticRaft(cB, 60, 0, NODES.B.h, 3); A.plasticRaft(cB, -150, 150, NODES.B.h, 2.5);
  A.rubberDuck(cB, [[-500, 0, 0], [540, 0, 0]], NODES.B.h, 5);
  A.sunkenScooter(cB, 100, 11, NODES.B.h - 0.25, 0.2); A.sunkenScooter(cB, -250, 11.4, NODES.B.h - 0.25, 2.2);
  A.foam(cS, 630, 0, 0.2, 8);
  A.reeds(cB, [[-560, -13, 583, -13], [-560, 13, 583, 13], [-295, -560, -295, -14], [129, 14, 129, 560], [-437, 14, -437, 700]], NODES.B.h - 0.2);
  A.trees(ctx, [[-250, -100], [-240, -110], [-230, -95], [80, 40], [90, 50], [100, 35], [480, 60], [470, 80], [-120, -300], [-100, -310]].map(([x, z]) => [x, z, 0.4, 1.1]), 'pollard');

      hudT -= dt; if (hudT <= 0) { hudT = 0.25; drawMap(); drawNodes(); }
    },
    readouts: () => [['Game time', clock()], ['Weather', WX[W.key].label + (W.k < 1 ? ' (changing)' : '')], ['Wind', state.wind.toFixed(1) + ' m/s · ' + beaufort(state.wind).replace('Beaufort ', 'Bft ')],
      ['Rain', (W.cur.rain * 18).toFixed(0) + ' mm/h'], ['Sea / boezem', `${NODES.sea.h.toFixed(2)} / ${NODES.B.h.toFixed(2)} m`], ['Control', C.maalstop ? 'MAALSTOP' : C.closure ? (W.cur.surge > 0.8 ? 'storm closure' : 'tide closure') : C.spui ? 'sluicing to sea' : 'nominal']],
  };
}
</script>
</body>
</html>
