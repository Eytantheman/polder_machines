<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noorder Valdeursluis, Zaandam</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import { start, THREE, M, mat, box, beam, cyl, ring, rand, pick, beaufort } from '../common/engine.js';
import * as A from '../common/assets.js';
import { Sequence, ease } from '../common/lock.js';

const Y_ZAAN = 0.0, Y_CANAL = -0.6, TOP = 1.4;
const HW = 3.0, XH = 14;                                      // chamber half width, valdeur heads at +-XH
const V = (x, y, z) => new THREE.Vector3(x, y, z);
let seq;

start({
  slug: 'zaandam-valdeursluis',
  meta: {
    title: 'Noorder Valdeursluis<br>Zaandam',
    original: 'Teekening van de Noorder Valdeursluis, liggende in de Schinkeldijk aan de Oostzijde van Zaandam',
    rows: [['Type', 'Brick lock with drop gates (valdeuren) hinged at the sill and wound up by chain winches'],
           ['Date', '1800–1850 · coloured drawing, 54.5 × 76 cm, anonymous'],
           ['Source', 'Noord-Hollands Archief, Provinciale Atlas Noord-Holland, coll. 122, inv. 271'],
           ['Licence', 'Public domain (PDM 1.0)']],
    link: 'https://noord-hollandsarchief.nl/beelden/beeldbank/detail/FF2C2232FB8E11DF9E4D523BC2E286E2',
  },
  panel: { title: 'Noorder Valdeursluis', sub: 'Zaan / Schinkeldijk · drag to orbit, scroll to zoom',
    note: 'A valdeur is hinged along its foot. To let a boat through, it is lowered flat onto the lock floor. Afterwards it is wound back up by the chain winches on the brick arches.' },
  controls: [{ key: 'wind', label: 'Wind speed', min: 0, max: 20, step: 0.1, value: 6, unit: 'm/s', hint: beaufort }],
  buttons: [{ label: 'Operate lock now', onClick: () => seq.trigger() }],
  camera: { pos: [-34, 17, 38], target: [0, 1, -2], max: 400 },
  shadowSize: 40,
  waters: [
    { x: [XH + 2.2, 170], z: [-1500, 1500], y: Y_ZAAN, color: 0x1d3532, size: 30 },
    { x: [-900, -XH - 2.2], z: [-8, 8], y: Y_CANAL, color: 0x183328 },
  ],
  exclusions: [[XH, 26, -HW - 1, HW + 1], [-26, -XH, -HW - 1, HW + 1]],
  ambient: { fishCenter: [40, 0, 10] },
  build,
});

function build(ctx) {
  const { scene } = ctx;
  const brick = M.brick(), stone = M.stone(), oak = M.oak(), iron = M.iron();
  // ---------------- land: Schinkeldijk with the lock, polder canal inland, far bank of the Zaan
  for (const s of [-1, 1]) {
    box(scene, M.grass(), -XH - 2.2, XH + 2.2, -3, TOP, s > 0 ? HW + 0.5 : -40, s > 0 ? 40 : -HW - 0.5);
    box(scene, M.clay(), XH + 2.2, 22, -3, TOP, s > 0 ? HW + 0.5 : -1500, s > 0 ? 1500 : -HW - 0.5);
    box(scene, M.grass(), -900, -XH - 2.2, -3, 0.2, s > 0 ? 8 : -400, s > 0 ? 400 : -8);
    box(scene, M.grass(), -XH - 2.2, XH + 2.2, -3, 0.6, s > 0 ? 40 : -400, s > 0 ? 400 : -40);
  }
  box(scene, mat(0x3a3d40, 0.9, 0, 0.1), 17, 21, TOP, TOP + 0.04, HW + 0.5, 1500);
  box(scene, mat(0x3a3d40, 0.9, 0, 0.1), 17, 21, TOP, TOP + 0.04, -1500, -HW - 0.5);
  box(scene, M.grass(), 170, 900, -3, 1.0, -1500, 1500);

  // ---------------- brick lock chamber with stone copings
  for (const s of [-1, 1]) {
    box(scene, brick, -XH - 2.2, XH + 2.2, -2.6, TOP, s * HW, s * (HW + 0.6));
    box(scene, stone, -XH - 2.2, XH + 2.2, TOP, TOP + 0.18, s * (HW - 0.1), s * (HW + 0.8));
  }
  box(scene, brick, -XH - 2.2, XH + 2.2, -2.8, -2.6, -HW, HW);
  const wm = mat(0x1d3836, 0.06, 0.2, 0, 1, { envMapIntensity: 1.5 });
  const chamber = new THREE.Mesh(new THREE.BoxGeometry(2 * XH - 1, 0.02, 2 * HW - 0.1), wm); scene.add(chamber);

  // valdeur heads: brick piers with an arch, a winch on top, and a gate hinged at the sill
  function head(xc, fallDir) {
    for (const s of [-1, 1]) box(scene, brick, xc - 1.1, xc + 1.1, TOP, 6.4, s * (HW + 0.1), s * (HW + 1.5));
    const arch = new THREE.Mesh(new THREE.TorusGeometry(HW + 0.8, 0.7, 8, 24, Math.PI), brick);
    arch.rotation.y = Math.PI / 2; arch.position.set(xc, 6.4, 0); arch.scale.set(1, 0.8, 1.6); arch.castShadow = true; scene.add(arch);
    box(scene, stone, xc - 1.2, xc + 1.2, 9.0, 9.25, -HW - 1.6, HW + 1.6);
    // winch (windas) with crank wheels and drum
    const drum = new THREE.Group(); drum.position.set(xc, 9.9, 0); scene.add(drum);
    cyl(drum, oak, [0, 0, -HW - 1.2], [0, 0, HW + 1.2], 0.35, 12);
    for (const s of [-1, 1]) { ring(drum, iron, V(0, 0, s * (HW + 1.3)), V(0, 0, 1), 0.85, 1.0, 0.08, 20);
      for (let i = 0; i < 4; i++) box(drum, iron, -0.04, 0.04, -0.9, 0.9, s * (HW + 1.3) - 0.03, s * (HW + 1.3) + 0.03).rotation.z = i * Math.PI / 4; }
    for (const s of [-1, 1]) box(scene, oak, xc - 0.3, xc + 0.3, 9.25, 10.4, s * (HW + 1.2) - 0.15, s * (HW + 1.2) + 0.15);
    // the gate: hinged along the sill (axis along Z), falls toward fallDir (-1 = toward -x)
    const hinge = new THREE.Group(); hinge.position.set(xc, -2.5, 0); scene.add(hinge);
    const gH = TOP + 2.2;
    box(hinge, mat(0x4e4234, 0.85, 0, 0.3, 5), -0.14, 0.14, 0, gH, -HW + 0.05, HW - 0.05);
    for (const y of [0.4, gH * 0.5, gH - 0.3]) box(hinge, oak, -0.2, 0.2, y - 0.14, y + 0.14, -HW + 0.05, HW - 0.05);
    for (const z of [-HW + 0.6, 0, HW - 0.6]) box(hinge, oak, -0.2, 0.2, 0, gH, z - 0.12, z + 0.12);
    box(hinge, iron, -0.25, 0.25, gH - 0.15, gH + 0.1, -HW + 0.4, -HW + 0.7); box(hinge, iron, -0.25, 0.25, gH - 0.15, gH + 0.1, HW - 0.7, HW - 0.4);
    const chain = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints([V(), V(), V(), V()]), new THREE.LineBasicMaterial({ color: 0x15171a }));
    scene.add(chain);
    return (k) => {                                            // k = 0 upright (closed), 1 flat on the floor (open)
      hinge.rotation.z = -fallDir * k * 1.48;
      drum.rotation.z = k * 9;
      chain.geometry.setFromPoints([V(xc, 9.9, -HW + 0.55), hinge.localToWorld(V(0, gH, -HW + 0.55)), V(xc, 9.9, HW - 0.55), hinge.localToWorld(V(0, gH, HW - 0.55))]);
    };
  }
  const zaanGates = [head(XH, -1), head(XH - 2.6, -1)];          // the drawing shows two valdeuren at each end
  const canalGates = [head(-XH, 1), head(-XH + 2.6, 1)];
  const setZ = (k) => zaanGates.forEach(f => f(k)), setC = (k) => canalGates.forEach(f => f(k));
  setZ(0); setC(0);

  // ---------------- vessels and the lock cycle (Zaan -> polder canal)
  const boats = [A.ship(ctx, 'tour', null, 0, 0, { scale: 0.8 }), A.ship(ctx, 'roboat', null, 0, 0, { scale: 1.3 }), A.ship(ctx, 'tour', null, 0, 0, { scale: 0.65 })];
  boats.forEach(b => b.visible = false);
  let boat = boats[0], level = Y_ZAAN;
  const pIn = new A.Path([[120, 0, -120], [70, 0, -40], [36, 0, -6], [XH + 8, 0, 0]]);
  const pOut = new A.Path([[0, 0, 0], [-XH - 8, 0, 0], [-80, 0, 0], [-200, 0, 0]]);
  const yAt = (x) => x > XH ? Y_ZAAN : x < -XH ? Y_CANAL : level;
  const put = (P, u) => { P.at(P.len * u, boat.position); const d = P.dir(P.len * u); boat.rotation.y = Math.atan2(-d.z, d.x); boat.position.y = yAt(boat.position.x) + 0.05 + Math.sin(ctx.time * 1.2) * 0.03; };
  const spray = ctx.smoke({ pos: V(-XH - 0.5, Y_CANAL + 0.3, 0), count: 80, rate: () => 0, life: 1.2, size0: 0.3, size1: 1.4, color: 0xffffff, opacity: 0.6, vel: V(-2, 1, 0), gravity: 4, drift: 0, spread: 1.5, jitter: 2.2 });
  const spray2 = ctx.smoke({ pos: V(XH - 3.4, Y_CANAL + 0.4, 0), count: 80, rate: () => 0, life: 1.2, size0: 0.3, size1: 1.4, color: 0xffffff, opacity: 0.6, vel: V(-2, 1, 0), gravity: 4, drift: 0, spread: 1.5, jitter: 2.2 });
  seq = new Sequence([
    { label: 'A boat comes up the Zaan', dur: 14, start: () => { boat = pick(boats); boat.visible = true; }, f: (u) => put(pIn, ease(u)) },
    { label: 'Lowering the Zaan-side valdeuren', dur: 6, f: (u) => setZ(ease(u)) },
    { label: 'Entering the lock', dur: 9, f: (u) => { const x = (XH + 8) * (1 - ease(u)); boat.position.set(x, yAt(x) + 0.05, 0); boat.rotation.y = Math.PI; } },
    { label: 'Winding the gates back up', dur: 7, f: (u) => setZ(1 - ease(u)) },
    { label: 'Levelling down to the polder canal', dur: 8, start: () => { spray.rate = () => 30; }, f: (u) => { level = Y_ZAAN + (Y_CANAL - Y_ZAAN) * ease(u); boat.position.y = level + 0.05; if (u >= 1) spray.rate = () => 0; } },
    { label: 'Lowering the canal-side valdeuren', dur: 6, f: (u) => setC(ease(u)) },
    { label: 'Leaving into the Schinkel', dur: 13, f: (u) => put(pOut, ease(u)) },
    { label: 'Winding the canal gates up', dur: 7, start: () => { boat.visible = false; }, f: (u) => setC(1 - ease(u)) },
    { label: 'Refilling from the Zaan', dur: 8, start: () => { spray2.rate = () => 30; }, f: (u) => { level = Y_CANAL + (Y_ZAAN - Y_CANAL) * ease(u); if (u >= 1) spray2.rate = () => 0; } },
  ], 10);

  // ---------------- the Zaan: houses, mills, industry, and contemporary life
  const greens = [0x2f5a45, 0x3a6b52, 0x2a4f3e, 0x41715a];
  for (let i = 0; i < 6; i++) A.zaanHouse(ctx, 10 - i * 9, -18 - rand(0, 3), Math.PI + rand(-0.1, 0.1), 6, 7, rand(3.6, 4.8), pick(greens), TOP);
  for (let i = 0; i < 4; i++) A.zaanHouse(ctx, 10 - i * 9, 46 + rand(0, 3), rand(-0.1, 0.1), 6, 7, rand(3.6, 4.8), pick(greens), TOP);
  for (let z = -300; z < 300; z += 18) A.zaanHouse(ctx, 182 + rand(-2, 2), z, -Math.PI / 2, 7, 8, rand(4, 6), pick([...greens, 0xd8d2c4, 0x8f4a36]), 1.0);
  A.smallMill(ctx, 185, -340, 1.0, 1.2, 'paltrok', Math.PI);
  A.smallMill(ctx, 190, 330, 1.0, 1.1, 'oil', Math.PI);
  A.smallMill(ctx, 230, 420, 1.0, 1.0, 'oil', Math.PI);
  A.smallMill(ctx, 175, -440, 1.0, 1.0, 'paltrok', Math.PI);
  // the cocoa factory (Zaandam's chocolate air) and the stacked-house hotel
  box(scene, mat(0x8a7a6a, 0.8, 0, 0.2), 200, 260, 1, 22, 60, 140);
  A.chimney(ctx, 215, 100, 48, { y: 22, r: 2.2, rate: () => 4, color: 0x7a5a42, opacity: 0.45, size: 20 });
  const hotel = new THREE.Group(); hotel.position.set(205, 1, -130); scene.add(hotel);
  for (let lv = 0; lv < 11; lv++) for (let k = 0; k < 4; k++) {
    const h = A.zaanHouse(ctx, 0, 0, 0, 5, 5, 2.2, pick([...greens, 0x2f5a45, 0x4d7a5e]), 0);
    scene.remove(h); h.position.set(-6 + k * 4.2 + rand(-0.6, 0.6), lv * 3.2, rand(-0.8, 0.8)); h.rotation.y = -Math.PI / 2 + rand(-0.2, 0.2); h.scale.set(0.9, 0.9, 0.9); hotel.add(h);
  }
  A.train(ctx, [[160, 0, -1400], [160, 0, 1400]], 1.0, 7, 30, [20, 45]);
  A.ship(ctx, 'tour', [[60, 0, -600], [60, 0, 600]], Y_ZAAN, 3.2, { scale: 0.9 });
  A.ship(ctx, 'roboat', [[110, 0, -200], [120, 0, 200], [95, 0, 220], [90, 0, -210]], Y_ZAAN, 1.8, { scale: 1.3 });
  A.rubberDuck(ctx, [[80, 0, -300], [90, 0, 0], [80, 0, 300], [70, 0, 0]], Y_ZAAN, 5);
  A.ship(ctx, 'tjalk', [[140, 0, 600], [140, 0, -600]], Y_ZAAN, 1.8, { scale: 0.9 });
  A.traffic(ctx, [[19, 0, -1500], [19, 0, 1500]], TOP + 0.04, 7, 14, { lanes: [-0.9, 0.9] });
  A.cyclists(ctx, [[-30, 0, 9.5], [-300, 0, 9.5]], 0.2, 3, 4.5, { cargo: true });
  A.airplane(ctx, { alt: [700, 1000], every: [30, 55] });
  A.balloon(ctx, { center: [0, 0, 0], h: 160, z: 250, color: 0xe08a1e });
  // nature
  A.waterfowl(ctx, [30, 110, -80, 80], Y_ZAAN, 5, 'swan');
  A.waterfowl(ctx, [-120, -25, -6, 6], Y_CANAL, 5, 'coot');
  A.waterfowl(ctx, [26, 80, -40, 40], Y_ZAAN, 8, 'duck');
  A.heron(ctx, 22.6, 30, Y_ZAAN - 0.35, 2.8);
  A.beaver(ctx, [[-40, 0, -3], [-160, 0, 3], [-60, 0, 4]], Y_CANAL);
  A.reeds(ctx, [[-20, 7.6, -300, 7.6], [-20, -7.6, -300, -7.6], [22.6, 40, 22.6, 300]], -0.2);
  A.trees(ctx, [[-30, 18, 0.2, 1], [-44, 20, 0.2, 1.1], [-60, -18, 0.2, 1], [-80, 22, 0.2, 0.9]], 'pollard');
  // pollution: bikes and a scooter in the canal, plastic and foam on the Zaan
  A.sunkenScooter(ctx, -26, 6.6, Y_CANAL - 0.2, 0.5);
  A.sunkenScooter(ctx, -34, -6.8, Y_CANAL - 0.25, 2.1);
  A.plasticRaft(ctx, 48, 30, Y_ZAAN, 2.5);
  A.foam(ctx, 23, -22, Y_ZAAN + 0.02, 4);
  A.oilSlick(ctx, 75, -60, Y_ZAAN, 6);

  return {
    update(dt) { seq.update(dt); chamber.position.set(0, level, 0); },
    readouts: () => [['Lock', seq.label], ['Zaan', Y_ZAAN.toFixed(1) + ' m'], ['Polder canal', Y_CANAL.toFixed(1) + ' m'], ['Chamber', level.toFixed(2) + ' m']],
  };
}
</script>
</body>
</html>
